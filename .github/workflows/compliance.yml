# Runs llvm/offload-test-suite across multiple Crucible tracks:
#   - dxil-to-metal  (macOS Metal via MetalDevice)
#   - dxil-to-spirv  (Linux Vulkan Lavapipe via VulkanDevice)
#   - spirv-to-metal (macOS Metal via SPIRVLoader -> MSLEmitter -> MetalDevice)
# and publishes the unified multi-track pass-rate dashboard (pages/index.html)
# to GitHub Pages.

name: Compliance

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cts_only:
        description: Run only the CTS compiler/reference validation
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  vulkan-cts-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CTS_REVISION: 0d18b347943e5e843529a05c95220e27fe30c538
      MOLTENVK_REVISION: db66022459ffb663aa2b50f6b018bc2e124f5edf
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Vulkan CTS 1.4.7.1
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/VK-GL-CTS
          ref: 0d18b347943e5e843529a05c95220e27fe30c538
          path: .cts/src

      - name: Install macOS Vulkan runtime and build tools
        run: |
          brew install ninja vulkan-loader spirv-tools
          python3 -m pip install --break-system-packages lxml lit

      - name: Setup third_party LLVM/MLIR
        uses: ./.github/actions/setup-llvm

      - name: Build Crucible compiler
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"
          cmake --build build --target cruciblec crucible-run --parallel 3

      - name: Verify reduced CTS compiler and GPU regressions
        run: lit -v --filter='spirv_dot_acc_sat|spirv_subword_buffers|spirv_helper_calls|spirv_volatile_copy|spirv_fixed_storage_blocks|spirv_fixed_signed_bytes|spirv_local_structs|spirv_local_arrays|cts_image_abi' build/test

      - name: Checkout pinned MoltenVK 1.4.2
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/MoltenVK
          ref: db66022459ffb663aa2b50f6b018bc2e124f5edf
          path: .cts/mvk

      - name: Identify Xcode build environment
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore CTS-only MoltenVK runtime
        id: mvk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cts/mvk/External
            .cts/mvk/Package/Release
          key: cts-mvk-${{ runner.os }}-${{ runner.arch }}-${{ env.MOLTENVK_REVISION }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/cts_moltenvk_hook.h', 'scripts/prepare_cts_moltenvk.py') }}
          restore-keys: |
            cts-mvk-${{ runner.os }}-${{ runner.arch }}-${{ env.MOLTENVK_REVISION }}-${{ steps.xcode.outputs.version }}-

      - name: Build MoltenVK with fail-closed Crucible shader compiler hook
        if: steps.mvk-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/prepare_cts_moltenvk.py --source .cts/mvk
          cd .cts/mvk
          ./fetchDependencies --macos --keep-cache
          make macos

      - name: Save CTS-only MoltenVK runtime
        if: steps.mvk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cts/mvk/External
            .cts/mvk/Package/Release
          key: cts-mvk-${{ runner.os }}-${{ runner.arch }}-${{ env.MOLTENVK_REVISION }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/cts_moltenvk_hook.h', 'scripts/prepare_cts_moltenvk.py') }}

      - name: Verify compiler hook against the real pinned converter ABI
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror \
            -I .cts/mvk/External/Vulkan-Headers/include \
            -I .cts/mvk/External/SPIRV-Cross \
            -I .cts/mvk/MoltenVKShaderConverter/MoltenVKShaderConverter \
            test/Inputs/cts_moltenvk_hook.cpp -o .cts/hook-test
          spirv-as --target-env vulkan1.3 test/Inputs/spirv_image_abi.spvasm \
            -o .cts/image-abi.spv
          spirv-val --target-env vulkan1.3 .cts/image-abi.spv
          spirv-as --target-env vulkan1.3 test/Inputs/spirv_cts_specialization.spvasm \
            -o .cts/specialization.spv
          spirv-val --target-env vulkan1.3 .cts/specialization.spv
          spirv-opt --version
          .cts/hook-test "$GITHUB_WORKSPACE/build/tools/cruciblec/cruciblec" \
            "$GITHUB_WORKSPACE/.cts/hook-test.trace" \
            "$GITHUB_WORKSPACE/.cts/image-abi.spv" \
            "$GITHUB_WORKSPACE/.cts/specialization.spv"

      - name: Verify pipeline specialization variants on the GPU
        run: |
          export CRUCIBLE_CTS_COMPILER="$GITHUB_WORKSPACE/build/tools/cruciblec/cruciblec"
          export CRUCIBLE_CTS_TRACE="$GITHUB_WORKSPACE/.cts/specialization-gpu.trace"
          export VK_DRIVER_FILES="$GITHUB_WORKSPACE/.cts/mvk/Package/Release/MoltenVK/dylib/macOS/MoltenVK_icd.json"
          export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
          export MVK_CONFIG_LOG_LEVEL=1
          build/tools/crucible-run/crucible-run --backend vulkan \
            --spv .cts/specialization.spv --buffer 0:u32:8:99 \
            --specialization default \
            --specialization 7:28000000,8:04000000,9:00000000 \
            --specialization 9:01000000,7:3a000000,8:01000000 \
            --specialization default | .toolchains/llvm/bin/FileCheck \
              test/Inputs/spirv_cts_specialization.spvasm
          test "$(grep -c '^compiled$' .cts/specialization-gpu.trace)" = 4
          test "$(wc -l < .cts/specialization-gpu.trace | tr -d ' ')" = 8

      - name: Restore CTS build and pinned external dependencies
        id: cts-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cts/src/external
            .cts/build
          key: vulkan-cts-${{ runner.os }}-${{ runner.arch }}-${{ env.CTS_REVISION }}-${{ steps.xcode.outputs.version }}-v2

      - name: Fetch pinned CTS dependencies and build deqp-vk
        if: steps.cts-build-cache.outputs.cache-hit != 'true'
        run: |
          python3 .cts/src/external/fetch_sources.py
          cmake -S .cts/src -B .cts/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDEQP_TARGET=osx
          cmake --build .cts/build --target deqp-vk --parallel 3

      - name: Save CTS build cache
        if: steps.cts-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cts/src/external
            .cts/build
          key: vulkan-cts-${{ runner.os }}-${{ runner.arch }}-${{ env.CTS_REVISION }}-${{ steps.xcode.outputs.version }}-v2

      - name: Run matched Crucible compiler and native reference CTS samples
        run: |
          python3 scripts/record_vulkan_cts.py select \
            --source .cts/src/external/vulkancts/mustpass/main/vk-default/spirv-assembly.txt \
            --prefix dEQP-VK.spirv_assembly.instruction.compute. --limit 256 \
            --output cts-results/caselist.txt
          MVK_DIR="$GITHUB_WORKSPACE/.cts/mvk/Package/Release/MoltenVK/dynamic/dylib/macOS"
          export VK_ICD_FILENAMES="$MVK_DIR/MoltenVK_icd.json"
          test -f "$VK_ICD_FILENAMES"
          strings "$MVK_DIR/libMoltenVK.dylib" | grep -F "Crucible CTS:" >/dev/null
          export VK_DRIVER_FILES="$VK_ICD_FILENAMES"
          COMMON=(python3 scripts/record_vulkan_cts.py run \
            --binary .cts/build/external/vulkancts/modules/vulkan/deqp-vk \
            --archive .cts/build/external/vulkancts/modules/vulkan \
            --library "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" \
            --caselist cts-results/caselist.txt --timeout 900 \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --cts-revision "$CTS_REVISION" \
            --runtime-version "MoltenVK@$MOLTENVK_REVISION;$(brew list --versions vulkan-loader);Xcode@${{ steps.xcode.outputs.version }}" \
            --baseline "vulkan-cts-1.4.7.1 spirv-assembly compute mustpass, evenly spaced 256 cases, fraction 0/1")
          "${COMMON[@]}" --qpa cts-results/reference.qpa \
            --metadata cts-results/reference-metadata.json
          "${COMMON[@]}" --compiler build/tools/cruciblec/cruciblec \
            --qpa cts-results/results.qpa --metadata cts-results/metadata.json
          python3 scripts/record_vulkan_cts.py record \
            --qpa cts-results/results.qpa --caselist cts-results/caselist.txt \
            --metadata cts-results/metadata.json \
            --reference-qpa cts-results/reference.qpa \
            --reference-metadata cts-results/reference-metadata.json \
            --data-dir cts-results/data

      - name: Upload CTS QPA, exact caselist, and run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-cts-results
          path: cts-results/
          if-no-files-found: warn

  compliance-dxil-to-metal:
    if: inputs.cts_only != true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout llvm/offload-test-suite
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-test-suite
          path: third_party/offload-test-suite

      - name: Checkout llvm/offload-golden-images
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-golden-images
          path: third_party/offload-golden-images

      - name: Restore DXC SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install DXC (from Vulkan SDK)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/lib
          VULKAN_VER="1.4.363.1"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/dxc* .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

      - name: Save DXC SDK cache
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install build dependencies
        run: |
          brew install ninja libpng
          pip3 install --break-system-packages lit psutil pyyaml

      - name: Setup third_party LLVM/MLIR
        uses: ./.github/actions/setup-llvm

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/bin/dxc" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"
          cmake --build build --parallel

      - name: Run offload-test-suite (dxil-to-metal)
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/.sdk/lib
          CRUCIBLE_OFFLOAD_RUNTIME: metal
        run: |
          lit -v --timeout=60 --output=offload-results-dxil-to-metal.json \
            build/test-offload || true
          test -s offload-results-dxil-to-metal.json

      - name: Upload dxil-to-metal results
        uses: actions/upload-artifact@v4
        with:
          name: offload-results-dxil-to-metal
          path: offload-results-dxil-to-metal.json
          if-no-files-found: error

  compliance-spirv-to-metal:
    if: inputs.cts_only != true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout llvm/offload-test-suite
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-test-suite
          path: third_party/offload-test-suite

      - name: Checkout llvm/offload-golden-images
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-golden-images
          path: third_party/offload-golden-images

      - name: Restore DXC SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install DXC (from Vulkan SDK)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/lib
          VULKAN_VER="1.4.363.1"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/dxc* .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

      - name: Save DXC SDK cache
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install build dependencies
        run: |
          brew install ninja libpng
          pip3 install --break-system-packages lit psutil pyyaml

      - name: Setup third_party LLVM/MLIR
        uses: ./.github/actions/setup-llvm

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/bin/dxc" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"
          cmake --build build --parallel

      - name: Run offload-test-suite (spirv-to-metal)
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/.sdk/lib
          CRUCIBLE_OFFLOAD_RUNTIME: metal
        run: |
          lit -v --timeout=60 -Dspirv_frontend=1 \
            --output=offload-results-spirv-to-metal.json \
            build/test-offload || true
          test -s offload-results-spirv-to-metal.json

      - name: Upload spirv-to-metal results
        uses: actions/upload-artifact@v4
        with:
          name: offload-results-spirv-to-metal
          path: offload-results-spirv-to-metal.json
          if-no-files-found: error

  compliance-dxil-to-spirv:
    if: inputs.cts_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout llvm/offload-test-suite
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-test-suite
          path: third_party/offload-test-suite

      - name: Checkout llvm/offload-golden-images
        uses: actions/checkout@v4
        with:
          repository: llvm/offload-golden-images
          path: third_party/offload-golden-images

      - name: Install Vulkan (Lavapipe) and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl ninja-build cmake libpng-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools python3-pip
          pip3 install --break-system-packages lit psutil pyyaml

      - name: Setup third_party LLVM/MLIR
        uses: ./.github/actions/setup-llvm

      - name: Restore Linux DXC SDK cache
        id: cache-linux-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: crucible-sdk-linux-x86_64-vk1.4.363.1

      - name: Install Linux DXC (from Vulkan SDK)
        if: steps.cache-linux-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/lib
          VULKAN_VER="1.4.363.1"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_VER}.tar.xz" -o /tmp/vulkansdk.tar.xz
          tar -xf /tmp/vulkansdk.tar.xz -C /tmp
          cp -a /tmp/${VULKAN_VER}/x86_64/bin/dxc* .sdk/bin/
          cp -a /tmp/${VULKAN_VER}/x86_64/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/${VULKAN_VER} /tmp/vulkansdk.tar.xz

      - name: Save Linux DXC SDK cache
        if: steps.cache-linux-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: crucible-sdk-linux-x86_64-vk1.4.363.1

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/bin/dxc" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"
          cmake --build build --parallel

      - name: Run offload-test-suite (dxil-to-spirv on Lavapipe)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.sdk/lib
          CRUCIBLE_OFFLOAD_RUNTIME: vulkan
        run: |
          lit -v --timeout=60 --output=offload-results-dxil-to-spirv.json \
            build/test-offload || true
          test -s offload-results-dxil-to-spirv.json

      - name: Upload dxil-to-spirv results
        uses: actions/upload-artifact@v4
        with:
          name: offload-results-dxil-to-spirv
          path: offload-results-dxil-to-spirv.json
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [compliance-dxil-to-metal, compliance-dxil-to-spirv, compliance-spirv-to-metal, vulkan-cts-macos]
    if: always() && github.ref == 'refs/heads/main' && inputs.cts_only != true && (needs.compliance-dxil-to-metal.result == 'success' || needs.compliance-dxil-to-spirv.result == 'success' || needs.compliance-spirv-to-metal.result == 'success' || needs.vulkan-cts-macos.result == 'success')
    outputs:
      artifact_name: ${{ steps.set-artifact-name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download offload result artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Restore historical compliance data cache
        uses: actions/cache/restore@v4
        with:
          path: .compliance-cache
          key: offload-history-v2-${{ github.sha }}
          restore-keys: |
            offload-history-v2-
            offload-history-

      - name: Record multi-track compliance history and build GitHub Pages site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_TS=$(git log -1 --pretty=%cI)
          python3 scripts/record_offload_compliance.py \
            --track-lit "dxil-to-metal=DXIL -> Metal (macOS)=artifacts/offload-results-dxil-to-metal.json" \
            --track-lit "dxil-to-spirv=DXIL -> SPIR-V (Linux Vulkan)=artifacts/offload-results-dxil-to-spirv.json" \
            --track-lit "spirv-to-metal=SPIR-V -> Metal (macOS)=artifacts/offload-results-spirv-to-metal.json" \
            --site-src pages \
            --out-dir _site \
            --sha "${{ github.sha }}" \
            --message "$COMMIT_MSG" \
            --author "$COMMIT_AUTHOR" \
            --timestamp "$COMMIT_TS" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --history-cache-dir .compliance-cache

      - name: Save historical compliance data cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .compliance-cache
          key: offload-history-v2-${{ github.sha }}

      - name: Restore historical CTS data cache
        uses: actions/cache/restore@v4
        with:
          path: .cts-history
          key: vulkan-cts-history-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vulkan-cts-history-v1-

      - name: Record CTS results without replacing other dashboard data
        if: needs.vulkan-cts-macos.result == 'success'
        run: |
          python3 scripts/record_vulkan_cts.py record \
            --qpa artifacts/results.qpa --caselist artifacts/caselist.txt \
            --metadata artifacts/metadata.json --data-dir _site/data \
            --reference-qpa artifacts/reference.qpa \
            --reference-metadata artifacts/reference-metadata.json \
            --history-cache .cts-history/history.json

      - name: Save historical CTS data cache
        if: needs.vulkan-cts-macos.result == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cts-history
          key: vulkan-cts-history-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set Pages artifact name
        id: set-artifact-name
        run: echo "artifact_name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.publish.outputs.artifact_name }}
