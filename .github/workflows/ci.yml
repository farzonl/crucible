name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout DirectX-Headers submodule
        run: git submodule update --init --depth 1 third_party/DirectX-Headers

      - name: Restore DXC SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install DXC (from Vulkan SDK)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/lib
          VULKAN_VER="1.4.363.1"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_VER}.tar.xz" -o /tmp/vulkansdk.tar.xz
          tar -xf /tmp/vulkansdk.tar.xz -C /tmp
          cp -a /tmp/${VULKAN_VER}/x86_64/bin/dxc* .sdk/bin/
          cp -a /tmp/${VULKAN_VER}/x86_64/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/${VULKAN_VER} /tmp/vulkansdk.tar.xz

      - name: Save DXC SDK cache
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl ninja-build cmake libvulkan-dev libopenblas0 python3-pip
          pip3 install --break-system-packages lit

      - name: Setup third_party LLVM/MLIR
        uses: ./.github/actions/setup-llvm

      - name: Restore Nacelle v0.0.3 cache
        id: cache-nacelle
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/nacelle
          key: crucible-nacelle-${{ runner.os }}-${{ runner.arch }}-v0.0.3

      - name: Download Nacelle v0.0.3 (Linux x64)
        if: steps.cache-nacelle.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchains/nacelle
          curl -fsSL "https://github.com/farzonl/Nacelle/releases/download/v0.0.3/nacelle-0.0.3-linux-x64.tar.gz" -o /tmp/nacelle.tar.gz
          tar -xzf /tmp/nacelle.tar.gz --strip-components=1 -C .toolchains/nacelle
          rm -f /tmp/nacelle.tar.gz

      - name: Save Nacelle v0.0.3 cache
        if: steps.cache-nacelle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolchains/nacelle
          key: crucible-nacelle-${{ runner.os }}-${{ runner.arch }}-v0.0.3

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DCRUCIBLE_NACELLE_DIR="${{ github.workspace }}/.toolchains/nacelle" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/bin/dxc" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"

      - name: Build
        run: cmake --build build --parallel

      - name: Run lit test suite
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.sdk/lib
        run: |
          lit -sv --output lit-results.json build/test

      - name: Upload lit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lit-results-linux
          path: lit-results.json

  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout DirectX-Headers submodule
        run: git submodule update --init --depth 1 third_party/DirectX-Headers

      - name: Restore DXC SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install DXC (from Vulkan SDK)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/lib
          VULKAN_VER="1.4.363.1"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/dxc* .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

      - name: Save DXC SDK cache
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: crucible-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1

      - name: Install build dependencies
        run: |
          brew install ninja
          pip3 install --break-system-packages lit

      - name: Setup third_party LLVM/MLIR
        uses: ./.github/actions/setup-llvm

      - name: Restore Nacelle v0.0.3 cache
        id: cache-nacelle
        uses: actions/cache/restore@v4
        with:
          path: .toolchains/nacelle
          key: crucible-nacelle-${{ runner.os }}-${{ runner.arch }}-v0.0.3

      - name: Download Nacelle v0.0.3 (macOS arm64)
        if: steps.cache-nacelle.outputs.cache-hit != 'true'
        run: |
          mkdir -p .toolchains/nacelle
          curl -fsSL "https://github.com/farzonl/Nacelle/releases/download/v0.0.3/nacelle-0.0.3-macos-arm64.tar.gz" -o /tmp/nacelle.tar.gz
          tar -xzf /tmp/nacelle.tar.gz --strip-components=1 -C .toolchains/nacelle
          rm -f /tmp/nacelle.tar.gz

      - name: Save Nacelle v0.0.3 cache
        if: steps.cache-nacelle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .toolchains/nacelle
          key: crucible-nacelle-${{ runner.os }}-${{ runner.arch }}-v0.0.3

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/llvm" \
            -DMLIR_DIR="${{ github.workspace }}/.toolchains/llvm/lib/cmake/mlir" \
            -DCRUCIBLE_NACELLE_DIR="${{ github.workspace }}/.toolchains/nacelle" \
            -DDXC_EXECUTABLE="${{ github.workspace }}/.sdk/bin/dxc" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"

      - name: Build
        run: cmake --build build --parallel

      - name: Run lit test suite
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/.sdk/lib
        run: |
          lit -sv --output lit-results.json build/test

      - name: Upload lit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lit-results
          path: lit-results.json
