# Benchmarks crucible against Apple's metal-shaderconverter on an Apple
# Silicon GPU and publishes the trend dashboard (pages/bench.html), mirroring
# Nacelle's macOS benchmark pipeline. The recorder preserves the compliance
# site data, so both workflows can deploy the whole site safely.

name: macOS Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: macos-latest
    outputs:
      artifact_name: ${{ steps.set-artifact-name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: .sdk
          key: crucible-bench-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1-msc

      - name: Install DXC and metal-shaderconverter
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk/bin .sdk/lib
          VULKAN_VER="1.4.363.1"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip" -o /tmp/vulkansdk.zip
          unzip -q /tmp/vulkansdk.zip -d /tmp/vulkansdk-installer
          INSTALLER_APP="$(find /tmp/vulkansdk-installer -maxdepth 2 -name '*.app' | head -n 1)"
          INSTALLER_BIN="${INSTALLER_APP}/Contents/MacOS/$(basename "${INSTALLER_APP}" .app)"
          "${INSTALLER_BIN}" --root "/tmp/vulkansdk" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          cp -a /tmp/vulkansdk/macOS/bin/dxc* .sdk/bin/
          cp -a /tmp/vulkansdk/macOS/lib/libdxcompiler* .sdk/lib/
          rm -rf /tmp/vulkansdk /tmp/vulkansdk-installer /tmp/vulkansdk.zip

          git clone --depth 1 https://github.com/MethanePowered/MetalShaderConverterBinary.git /tmp/msc
          unzip -q /tmp/msc/binaries/MacOS.zip -d /tmp/msc-bins
          mkdir -p .sdk/include
          cp -a /tmp/msc-bins/bin/metal-shaderconverter .sdk/bin/
          cp -a /tmp/msc-bins/lib/libmetalirconverter.dylib .sdk/lib/ 2>/dev/null || true
          cp -a /tmp/msc-bins/include/* .sdk/include/ 2>/dev/null || true
          chmod +x .sdk/bin/metal-shaderconverter
          rm -rf /tmp/msc /tmp/msc-bins

      - name: Save SDK cache
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sdk
          key: crucible-bench-sdk-${{ runner.os }}-${{ runner.arch }}-vk1.4.363.1-msc

      - name: Install build dependencies
        run: brew install llvm ninja

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(brew --prefix llvm)/lib/cmake/llvm" \
            -DCRUCIBLE_ENABLE_TESTS=OFF
          cmake --build build --target cruciblec crucible-run crucible-bench --parallel

      - name: Run benchmarks
        env:
          DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/.sdk/lib
        run: |
          python3 scripts/bench.py \
            --dxc "${{ github.workspace }}/.sdk/bin/dxc" \
            --msc "${{ github.workspace }}/.sdk/bin/metal-shaderconverter" \
            --iters 50 --warmup 5 \
            -o bench-results.json

      - name: Restore benchmark history cache
        uses: actions/cache/restore@v4
        with:
          path: .bench-cache
          key: bench-history-macos-${{ github.sha }}
          restore-keys: |
            bench-history-macos-

      - name: Restore compliance history cache
        uses: actions/cache/restore@v4
        with:
          path: .compliance-cache
          key: offload-history-v2-${{ github.sha }}
          restore-keys: |
            offload-history-v2-
            offload-history-

      - name: Record benchmark history and build GitHub Pages site
        run: |
          MSG="$(git log -1 --pretty=%s)"
          AUTHOR="$(git log -1 --pretty=%an)"
          TS="$(git log -1 --pretty=%cI)"
          python3 scripts/record_bench_history.py \
            --bench-json bench-results.json \
            --site-src pages \
            --out-dir _site \
            --sha "${{ github.sha }}" \
            --message "$MSG" \
            --author "$AUTHOR" \
            --timestamp "$TS" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --history-cache .bench-cache/bench-history-macos.json \
            --compliance-cache-dir .compliance-cache \
            --os macOS \
            --history-filename bench-history-macos.json

      - name: Save benchmark history cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .bench-cache
          key: bench-history-macos-${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set Pages artifact name
        id: set-artifact-name
        run: echo "artifact_name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: benchmark
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.benchmark.outputs.artifact_name }}
